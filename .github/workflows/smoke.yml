# Browser checks against the deployed site, run by hand after frontend/scripts/deploy.ps1 (Actions tab -> smoke ->
# Run workflow). Works with the backend live or paused: the specs answer status.json themselves where it matters and
# never reach the model (smoke.spec.ts checks the real status.json). No AWS credentials: the site is public.
name: smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://d2js86b0xg0ozs.cloudfront.net

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/layout.spec.ts tests/e2e/a11y.spec.ts tests/e2e/testbench.spec.ts tests/e2e/intro.spec.ts tests/e2e/livemock.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-results-${{ github.run_id }}
          path: frontend/test-results
          retention-days: 14
