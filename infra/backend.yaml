AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Code-generation backend - llama.cpp Q4_K_M model on arm64 Lambda, SSE streaming through a Function URL, guarded by guard.py

Parameters:
  TableName: {Type: String, Default: codegen-state}
  ImageUri: {Type: String, Description: "arm64 image pushed by infra/scripts/build_push.ps1"}
  MemoryMb: {Type: Number, Default: 3008, Description: "this account is capped at 3008 MB; Lambda gives ~1 vCPU per 1769 MB"}
  LlamaThreads: {Type: String, Default: "2"}

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/codegen-backend, RetentionInDays: 7}

  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: codegen-backend
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: !Ref MemoryMb
      Timeout: 90
      # ReservedConcurrentExecutions is intentionally unset: this account's quota is 10 (AWS requires 100 unreserved).
      # The application-level slots in guard.py are the concurrency cap until the quota increase is approved.
      LoggingConfig: {LogGroup: !Ref LogGroup}
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          LLAMA_THREADS: !Ref LlamaThreads
          GEN_DEADLINE_S: "75"
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_READINESS_CHECK_PATH: /health
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem]
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type, x-api-key]

Outputs:
  FunctionUrl: {Value: !GetAtt FunctionUrl.FunctionUrl}
  FunctionName: {Value: !Ref Function}
