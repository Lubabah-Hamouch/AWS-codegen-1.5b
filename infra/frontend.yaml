AWSTemplateFormatVersion: '2010-09-09'
Description: Code-generation playground frontend - static Next.js export in a private S3 bucket behind CloudFront (OAC)

# The browser talks to the Lambda Function URL directly; CloudFront only serves static files. status.json is written
# by the kill-switch tooling and the circuit breaker (see backend.yaml) and is never cached, so a paused backend shows
# up on the next page load without invoking the function.

Parameters:
  FunctionUrl:
    Type: String
    Description: "codegen-backend Function URL (https://....lambda-url.eu-north-1.on.aws/), allowed in connect-src"

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The export writes /notes/index.html; S3 behind OAC has no index documents, so map directory URLs here.
  IndexRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-index-rewrite
      AutoPublish: true
      FunctionConfig: {Comment: directory URL -> index.html, Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.endsWith('/')) r.uri += 'index.html';
          else if (r.uri.split('/').pop().indexOf('.') === -1) r.uri += '/index.html';
          return r;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub
              - "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${Origin}; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
              - Origin: !Select [0, !Split ['/', !Select [1, !Split ['://', !Ref FunctionUrl]]]]
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: codegen playground
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt IndexRewrite.FunctionMetadata.FunctionARN}]
        CacheBehaviors:
          - PathPattern: /status.json
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}
          - {ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}

Outputs:
  BucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
