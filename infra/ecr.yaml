AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for the backend images. Keeps only the newest 2 images to cap storage cost; emptied on delete.

Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: codegen-backend
      EmptyOnDelete: true
      ImageScanningConfiguration: {ScanOnPush: false}
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep newest 2 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}

Outputs:
  RepositoryUri: {Value: !GetAtt Repo.RepositoryUri}
